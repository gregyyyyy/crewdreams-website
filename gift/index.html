<script>
// Link on the printed cards (QR code "3 months free"). For now the same as /app; once the gift offer exists, it opens the offer here.
// Short link to share (WhatsApp, QR codes, business cards): shows a clean preview with the logo,
// then sends each device to the right store. While a store link is empty, the visitor lands on the website.
(function () {
  var APP_STORE = '';
    // not in the App Store yet: once live, set it to the app's App Store link
  var PLAY_STORE = '';    // once live: 'https://play.google.com/store/apps/details?id=com.crewdreams.app'
  var SITE = 'https://crewdreams.com/';
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  location.replace((ios && APP_STORE) || (android && PLAY_STORE) || SITE);
})();
</script>
